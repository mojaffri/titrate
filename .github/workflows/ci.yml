name: CI

on:
  push:
  pull_request:

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install infrastructure validators
        run: pip install "cfn-lint>=1.40,<2" "checkov>=3.2,<4"
      - name: Validate CloudFormation
        run: cfn-lint infra/aws/*.yml
      - name: Scan infrastructure for misconfiguration
        run: checkov --directory infra/aws --framework cloudformation --config-file .checkov.yml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src webapp tests experiments
      - run: mypy src
      - run: pytest -q
      - name: Streamlit import smoke test
        run: python -m py_compile webapp/app.py webapp/pages/1_Model_Lab.py

  container:
    runs-on: ubuntu-latest
    needs: [quality, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable API image
        run: docker build --build-arg MODEL_SAMPLES=96 --build-arg MODEL_EPOCHS=35 -t titrate-api:test .
      - name: Start container
        run: docker run --detach --name titrate-api --publish 8000:8000 titrate-api:test
      - name: Exercise health, metadata, and prediction endpoints
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep --quiet '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/metadata | grep --quiet '"artifact_version":2'
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"points":[[360.0,2.0,1.0]],"mc_samples":10}' \
            http://127.0.0.1:8000/predict | grep --quiet '"predictions"'
          curl --fail --silent http://127.0.0.1:8000/monitoring | grep --quiet '"total_predictions":1'
          curl --fail --silent http://127.0.0.1:8000/metrics | grep --quiet 'titrate_predictions_total'
      - name: Show container logs on failure
        if: failure()
        run: docker logs titrate-api
      - name: Stop container
        if: always()
        run: docker rm --force titrate-api
