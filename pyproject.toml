[project]
name = "titrate"
version = "0.2.0"
description = "Constrained Bayesian optimization and ML surrogates for chemical process design"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "torch>=2.3",
]

[project.optional-dependencies]
web = ["matplotlib>=3.8", "streamlit>=1.38"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8"]
mlops = ["mlflow>=2.16"]
dev = [
    "matplotlib>=3.8",
    "streamlit>=1.38",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["titrate"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
