AWSTemplateFormatVersion: "2010-09-09"
Description: Optional account-level AWS cost alert for the Titrate portfolio deployment.

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that receives actual and forecasted cost alerts.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Account-wide monthly cost threshold in US dollars.

Resources:
  PortfolioBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: titrate-portfolio-monthly-cost
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: EMAIL

Outputs:
  BudgetName:
    Value: !Ref PortfolioBudget
    Description: Account-level budget used to alert before portfolio costs grow unexpectedly.
